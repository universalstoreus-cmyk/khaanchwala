name: Generate Payload Migration

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/migrations/**'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/payload_dev
      PAYLOAD_SECRET: ci-migration-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload migration
        run: pnpm payload migrate:create initial --force-accept-warning

      - name: Commit generated migration
        run: |
          if git diff --quiet -- src/migrations; then
            echo "No migration files were generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/migrations
          git commit -m "chore: add Payload database migration"
          git push
